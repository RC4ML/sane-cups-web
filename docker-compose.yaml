services:
  printer:
    image: ghcr.io/rc4ml/sane-cups-web:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      CUPS_SERVER: cups:631
    depends_on:
      cups:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8085"
    networks:
      - default
      - printing
    volumes:
      - ./scans:/app/scans
      - ./config.yaml:/app/config.yaml:ro

  cups:
    image: ghcr.io/rc4ml/sane-cups-web-cups:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/cups/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - printing
    volumes:
      - cups-state:/var/lib/cups
      - cups-spool:/var/spool/cups

networks:
  printing:

volumes:
  cups-state:
  cups-spool:
