% These substitute fonts contain both Chinese and Latin glyphs.
% DroidSansFallback alone omits Latin text in some GBK invoices.
/KaiTi << /FileType /TrueType /Path (/usr/share/fonts/truetype/arphic/ukai.ttc) /SubfontID 0 /CSI [(GB1) 5] >> ;
/SimSun << /FileType /TrueType /Path (/usr/share/fonts/truetype/arphic/uming.ttc) /SubfontID 0 /CSI [(GB1) 5] >> ;
/SimHei << /FileType /TrueType /Path (/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc) /SubfontID 0 /CSI [(GB1) 5] >> ;
/Adobe-GB1 /SimSun ;
/Adobe-GB1-Bold /SimHei ;
