User lp
Group lp
SystemGroup root lpadmin
ServerRoot /var/lib/cups
RequestRoot /var/spool/cups
CacheDir /var/lib/cups/cache
StateDir /run/cups
ServerKeychain /var/lib/cups/ssl
AccessLog
ErrorLog stderr
# CUPS 2.4.10 dereferences an empty PageLog when a job completes.
PageLog /dev/null
FatalErrors config listen
