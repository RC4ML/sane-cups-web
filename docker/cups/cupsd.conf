LogLevel warn
MaxLogSize 0
Listen 0.0.0.0:631
Listen /run/cups/cups.sock
ServerAlias cups
Browsing Off
WebInterface No
DefaultAuthType Basic
DefaultEncryption IfRequested
DefaultPolicy default
ErrorPolicy stop-printer
PreserveJobHistory Yes
PreserveJobFiles No

# Only the Web app belongs on this container's dedicated Docker network.
# Authentication is handled at the Web ingress; CUPS is not a public endpoint.
<Location />
  Order allow,deny
  Allow from @LOCAL
</Location>
# cancel -a uses /admin/ as its IPP request path. Restrict administrative
# operations in the policy below, while protecting config/log HTTP resources.
<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from localhost
</Location>
<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow from localhost
</Location>

<Policy default>
  # The application has a shared queue, including cancel-all functionality.
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit Create-Job Print-Job Print-URI Validate-Job Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job Cancel-Job Cancel-Jobs>
    Order deny,allow
  </Limit>
  <Limit Get-Printer-Attributes Get-Printer-Supported-Values Get-Jobs Get-Job-Attributes Get-Subscriptions Get-Subscription-Attributes CUPS-Get-Printers CUPS-Get-Classes CUPS-Get-Default CUPS-Get-PPDs CUPS-Get-PPD>
    Order deny,allow
  </Limit>
  <Limit Set-Printer-Attributes CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow from localhost
  </Limit>
  <Limit CUPS-Get-Document>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow from localhost
  </Limit>
  <Limit All>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow from localhost
  </Limit>
</Policy>
